<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Workshop Reports</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#2f3a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workshop Reports">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="jszip.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<style>
:root{
  --bg:#f4f3ef; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6a64; --line:#dddad2;
  --brand:#e3b91c; --brand-ink:#3b3000; --steel:#2f3a45; --ok:#2e7d4f; --warn:#b26a00; --bad:#b3261e;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:270px 1fr;height:100vh}
aside{background:var(--steel);color:#e8ebee;display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid #46525e}
.brand img{width:46px;background:#fff;border-radius:6px;padding:3px}
.brand b{display:block;font-size:14px;letter-spacing:.2px}
.brand small{color:#aab4bd}
.side-actions{padding:12px 14px;display:flex;gap:8px}
.side-actions input{flex:1;min-width:0;background:#3a4652;border:1px solid #4d5a67;border-radius:6px;padding:7px 9px;color:#fff}
.usage{margin-top:8px;font-size:11.5px;color:#cfd6dc}
.usage .bar{height:6px;background:#46525e;border-radius:4px;overflow:hidden;margin-top:3px}
.usage .bar i{display:block;height:100%;background:#2e7d4f}
.usage.warn .bar i{background:#e3b91c}.usage.full .bar i{background:#d9534f}
.pill.arch{background:#5a6b7c;color:#fff}
.side-filters{display:flex;gap:6px;padding:0 14px 10px}
.side-filters select{flex:1;min-width:0;background:#3a4652;border:1px solid #4d5a67;border-radius:6px;padding:5px 6px;color:#fff;font-size:12.5px}
.joblist{overflow:auto;flex:1;padding:0 8px 12px}
.jobitem{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:9px 10px;color:inherit;cursor:pointer;margin-bottom:2px}
.jobitem:hover{background:#3a4652}
.jobitem.on{background:#4a5866}
.jobitem .jn{font-weight:600}
.jobitem .jd{color:#b9c2ca;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:4px;margin-top:5px}
.pill{font-size:10.5px;padding:1px 6px;border-radius:9px;background:#56626e;color:#dfe5ea}
.pill.ok{background:#2e7d4f;color:#fff}
.side-note{padding:10px 14px;font-size:12px;color:#aab4bd;border-top:1px solid #46525e}
aside .btn:not(.primary){color:var(--ink)}
main{min-width:0;min-height:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;background:#ecebe6;padding:3px;border-radius:9px}
.tab{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.tab.on{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#c9c6bc}
.dot.ok{background:var(--ok)}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(420px,1fr) minmax(380px,1fr)}
.editor{overflow:auto;padding:18px 20px 60px}
.previewWrap{overflow:auto;background:#d9d6cd;padding:18px;border-left:1px solid var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.card h2{font-size:14px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .num{background:var(--brand);color:var(--brand-ink);border-radius:5px;padding:0 7px;font-size:12px}
.card h2 .lock{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
label.f input,label.f select,textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink);font-size:14px}
textarea{width:100%;resize:vertical;min-height:60px}
.locked{background:#f6f5f1;border:1px dashed var(--line);border-radius:6px;padding:9px 11px;color:#3d3c38}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#f6f5f1}
.btn.primary{background:var(--brand);border-color:#c9a312;color:var(--brand-ink);font-weight:600}
.btn.primary:hover{background:#d8ae12}
.btn.dark{background:var(--steel);border-color:var(--steel);color:#fff}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;cursor:pointer}
.seg button.on{background:var(--steel);color:#fff;border-color:var(--steel)}
.seg .cnt{font-size:11px;background:var(--brand);color:var(--brand-ink);border-radius:8px;padding:0 6px;margin-left:5px}
.stmt{display:grid;grid-template-columns:22px 1fr 26px;gap:8px;align-items:start;padding:5px 0;border-bottom:1px solid #f0eee8}
.stmt input[type=checkbox]{width:17px;height:17px;margin-top:7px;accent-color:#2f3a45}
.stmt textarea{min-height:36px;padding:6px 8px;font-size:13.5px}
.stmt.off textarea{color:#8d8b84;background:#fbfaf7}
.x{border:0;background:none;color:#9b988f;cursor:pointer;font-size:16px;padding:6px 4px}
.x:hover{color:var(--bad)}
.bor{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px}
.bor .out{grid-column:1/-1;font-size:12.5px;color:var(--steel);background:#f6f5f1;border-radius:5px;padding:4px 8px;margin-top:-2px}
.drop{border:2px dashed #cfcabb;border-radius:8px;padding:14px;text-align:center;color:var(--muted);background:#fbfaf6;cursor:pointer}
.drop.hover{border-color:var(--brand);background:#fff8dc}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.th{position:relative;background:#eee;border-radius:6px;overflow:hidden;aspect-ratio:4/3}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.65));padding:14px 4px 3px}
.th .bar button{border:0;background:rgba(255,255,255,.88);border-radius:4px;font-size:12px;cursor:pointer;padding:1px 6px}
.th .n{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:4px;padding:0 5px}
.th.busy{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.status{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--r);margin-bottom:14px;border:1px solid}
.status.wait{background:#fff7e6;border-color:#f0d39a;color:#6b4300}
.status.ready{background:#e9f5ee;border-color:#a9d6bb;color:#1d5236}
.status ul{margin:4px 0 0;padding-left:18px}
.exportbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.banner{background:#fff3cd;color:#664d03;padding:8px 18px;font-size:13px;border-bottom:1px solid #f0d78c}
.banner.err{background:#fde8e6;color:#7a1c14;border-color:#f3b9b2}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--muted);gap:12px;text-align:center;padding:40px}
.empty img{width:120px;opacity:.9}
/* Paper preview */
.paper{background:#fff;width:100%;max-width:640px;margin:0 auto 18px;aspect-ratio:297/420;box-shadow:0 2px 10px rgba(0,0,0,.15);padding:6% 6.2%;overflow:hidden;position:relative;font-family:Arial,Helvetica,sans-serif;color:#000}
.pg{position:absolute;right:10px;bottom:6px;font-size:10px;color:#999}
.hdr{display:grid;grid-template-columns:29.6% 24.9% 45.5%;border:1px solid #000;width:92%;margin:0 auto}
.hdr>div{border-right:1px solid #000;padding:4px;display:flex;align-items:center;justify-content:center}
.hdr>div:last-child{border-right:0;justify-content:flex-start}
.hdr img{width:100%}
.hdr .t{font-weight:700;text-align:center;font-size:clamp(8px,1.5vw,13px);line-height:1.2}
.hdr>div.d{display:block;align-self:center;padding:4px 6px}
.hdr .d{font-size:clamp(6px,1.05vw,10px);line-height:1.38}
.hdr .d b{font-weight:700}
.ptitle{text-align:center;font-size:clamp(9px,1.7vw,16px);margin:5% 0 3%}
.ptitle.b{font-weight:700}
.pimg{display:block;margin:0 auto 3%;max-width:88%;max-height:40%}
.phead{font-weight:700;font-size:clamp(7px,1.15vw,11px);margin:2.4% 0 1%}
.pp{font-size:clamp(6.5px,1.05vw,10px);margin:0 0 1%}
.pul{margin:0 0 1% 0;padding-left:5%;font-size:clamp(6.5px,1.05vw,10px)}
.pul ul{padding-left:6%;list-style:circle}
.phr{border:0;border-top:1px solid #999;margin:2% 0}
.psign{text-align:center;font-family:"Arial Black",Arial,sans-serif;font-weight:900;font-size:clamp(8px,1.4vw,13px);margin:4% 0 1%}
.psig{border-collapse:collapse;margin:5% auto 1%;width:76%;font-size:clamp(5.5px,.9vw,9px)}
.psig th{background:#000;color:#fff;text-align:left;padding:1.2% 1.4%;border:1px solid #000}
.psig th:nth-child(n+3){text-align:center}
.psig td{border:1px solid #9aa0a6;padding:1.6% 1.4%;height:2.4em;vertical-align:middle}
.psig td.c{text-align:center}
.ph-empty{border:1px dashed #bbb;color:#999;text-align:center;padding:12% 0;font-size:11px;margin:0 6% 3%}
dialog{border:0;border-radius:10px;padding:0;box-shadow:0 10px 40px rgba(0,0,0,.3);max-width:520px;width:92vw}
dialog .dh{padding:16px 18px 6px;font-weight:700;font-size:16px}
dialog .db{padding:6px 18px 12px}
dialog .df{padding:12px 18px 16px;display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.mOnly{display:none}
.login{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#2f3a45,#1f272f);display:flex;align-items:center;justify-content:center;padding:20px}
.login[hidden]{display:none}
.login-card{background:#fff;border-radius:12px;padding:26px 24px;width:min(380px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:12px}
.login-card img{width:150px;margin:0 auto}
.login-card h1{font-size:18px;text-align:center;margin:0 0 4px}
.login-card label.f{margin-bottom:10px}
.login-card input{font-size:16px}
.login-err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
.scrim{display:none}
@media (max-width:1100px){.work{grid-template-columns:1fr}.previewWrap{border-left:0;border-top:1px solid var(--line)}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;height:100dvh}
  aside{position:fixed;inset:0 auto 0 0;width:min(86vw,320px);z-index:30;transform:translateX(-102%);transition:transform .2s ease;box-shadow:4px 0 20px rgba(0,0,0,.3)}
  .app.navopen aside{transform:none}
  .app.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .mOnly{display:inline-flex}
  .topbar{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .topbar h1{order:1;flex:1 1 calc(100% - 140px);font-size:15px}
  .topbar .tabs{order:3;flex:1 1 100%;justify-content:space-between}
  .topbar .tab{flex:1;justify-content:center;padding:8px 4px}
  .work{display:block;overflow:auto}
  .editor{overflow:visible;padding:12px 12px 40px}
  .previewWrap{display:none;overflow:visible}
  .app.showprev .previewWrap{display:block}
  .app.showprev .editor{display:none}
  .grid2{grid-template-columns:1fr}
  .bor{grid-template-columns:1fr 1fr 1fr}
  .bor .btn{grid-column:1/-1;justify-content:center}
  .thumbs{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
  .th .bar button{padding:4px 8px;font-size:13px}
  .stmt textarea,label.f input,label.f select,textarea{font-size:16px}
  .card{padding:12px}
  .exportbar .btn{flex:1;justify-content:center}
  .empty{padding:24px}
}
</style>
</head>
<body>
<div class="app" id="app"><div class="scrim" id="scrim"></div>
  <aside>
    <div class="brand"><img id="logoSide" alt=""><div><b>Engineering Workshop Reports</b><small>Hydraulic Engineering SARL</small></div></div>
    <div class="side-actions"><input id="search" placeholder="Search jobs…"><button class="btn primary small" id="newJobBtn">+ New job</button></div>
    <div class="side-filters"><select id="fCat"><option value="">All categories</option></select><select id="fStage"><option value="active">Active jobs</option><option value="cond">Condition open</option><option value="wip">WIP open</option><option value="ready">Ready to archive</option><option value="archived">Archived</option><option value="">All jobs</option></select></div>
    <div class="joblist" id="joblist"></div>
    <div class="side-note"><span id="syncNote">Connecting…</span>
      <div id="usage" class="usage" title="Photos of active jobs stored in the cloud (free plan: 1 GB). Archive finished jobs to free space."></div>
      <div id="who" style="margin-top:6px;color:#dfe5ea;font-size:12px;word-break:break-all"></div>
      <div class="row" style="margin-top:8px;gap:6px">
        <button class="btn small" id="installBtn" style="display:none;flex:1;justify-content:center">📲 Install app</button>
        <button class="btn small" id="backupBtn" style="flex:1;justify-content:center" title="Download all jobs as a .json backup">⬇ Backup</button>
        <button class="btn small" id="signOutBtn" style="flex:1;justify-content:center">Sign out</button>
      </div>
      <button class="btn small" id="pwBtn" style="margin-top:6px;width:100%;justify-content:center">🔑 Change password</button></div>
  </aside>
  <main>
    <div id="banner"></div>
    <div id="mainArea" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>
  </main>
</div>

<div id="login" class="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <img id="loginLogo" alt="Hydraulic Engineering SARL">
    <h1>Engineering Workshop Reports</h1>
    <div id="loginBody">
      <label class="f">Email<input id="lgEmail" type="email" autocomplete="username" required></label>
      <label class="f">Password<input id="lgPass" type="password" autocomplete="current-password" required></label>
      <button class="btn primary" id="lgBtn" type="submit" style="width:100%;justify-content:center;padding:10px">Sign in</button>
      <div class="login-err" id="lgErr"></div>
      <div class="muted" style="font-size:12px;margin-top:10px">Accounts are created by your administrator.</div>
    </div>
  </form>
</div>
<dialog id="dlg"><div class="dh" id="dlgT"></div><div class="db" id="dlgB"></div><div class="df"><button class="btn" id="dlgNo">Cancel</button><button class="btn primary" id="dlgYes">OK</button></div></dialog>
<div class="toast" id="toast"></div>

function dialog(title, bodyHtml, okLabel="OK", cancel=true){
  return new Promise(res=>{
    const d=$("#dlg"); $("#dlgT").textContent=title; $("#dlgB").innerHTML=bodyHtml;
    $("#dlgYes").textContent=okLabel; $("#dlgNo").style.display=cancel?"":"none";
    const done=v=>{ d.close(); $("#dlgYes").onclick=$("#dlgNo").onclick=null; res(v); };
    $("#dlgYes").onclick=()=>done(true); $("#dlgNo").onclick=()=>done(false);
    d.oncancel=e=>{e.preventDefault(); done(false);};
    try{ d.showModal(); }catch(e){ d.setAttribute("open",""); }
  });
}
function getPath(o,p){ return p.split(".").reduce((a,k)=>a==null?a:a[k],o); }
function setPath(o,p,v){ const ks=p.split("."); let a=o; for(let i=0;i<ks.length-1;i++){ if(a[ks[i]]==null) a[ks[i]]={}; a=a[ks[i]]; } a[ks[ks.length-1]]=v; }
function numWord(n){ n=Number(n); return (Number.isInteger(n)&&n>=0&&n<NUMW.length)?NUMW[n]:String(n); }
function fmtNum(v){ const n=Number(v); if(!isFinite(n)) return String(v); return String(+n.toFixed(3)); }
function boreLine(r){
  if(r.n===""||r.n==null||r.d===""||r.d==null||r.t===""||r.t==null) return null;
  const n=Math.round(Number(r.n)); if(!(n>0)) return null;
  return `${numWord(n)} (${n}) ${n===1?"hole":"holes"}: Ø ${fmtNum(r.d)} mm, thickness ${fmtNum(r.t)} mm`;
}
function safeName(s){ return String(s).replace(/[\\/:*?"<>|]+/g," ").replace(/\s+/g," ").trim().slice(0,200); }

function newJob(){
  const plates={}; COMPONENTS.forEach(c=>plates[c]=STATEMENTS[c].map(t=>({t,on:false,custom:false})));
  return {
    v:2, createdAt:Date.now(), updatedAt:Date.now(), category:"bucket",
    header:{customer:"KCC - SKM", contact:"", make:"CATERPILLAR", model:"", item:"", assetId:"", event:"", jobNo:"", desc:"",
            condDate:todayStr(), wipDate:"", complDate:""},
    cond:{photos:[], plates, activeComp:"Visor", boring:[], exclusions:TXT_EXCL,
          inspector:"Mohamad Berjawi", inspDate:"", approver:"Moustapha Matar", apprDate:"", done:false},
    wip:{progress:[], paint:[], done:false},
  };
}
function normalize(j){
  const b=newJob();
  if(!CATS[j.category]) j.category="bucket";
  j.header=Object.assign(b.header,j.header||{});
  j.cond=Object.assign(b.cond,j.cond||{});
  COMPONENTS.forEach(c=>{ if(!Array.isArray(j.cond.plates[c])) j.cond.plates[c]=b.cond.plates[c]; });
  j.wip=Object.assign(b.wip,j.wip||{});
  return j;
}
function completionState(j){
  if(j.archived) return {ready:true,missing:[]};
  const missing=[];
  if(!j.cond.photos.length) missing.push("Condition Report has no inspection photos");
  if(!j.cond.done) missing.push("Condition Report not marked complete");
  if(!j.wip.paint.length) missing.push("WIP Report has no Paint & Package photos");
  if(!j.wip.done) missing.push("WIP Report not marked complete");
  return {ready:!missing.length, missing};
}

let DB=null, ASSETS=null, DL=null, USER=null;

let canWrite=true;

let SB=null, URLC={};   // Supabase client; photo id -> displayable URL
function photoSrc(p){ return p.src || (p.id && URLC[p.id]) || ""; }
function imgAttrs(p){ const u=photoSrc(p); return (u?`src="${esc(u)}" `:"")+(p.id?`data-pid="${esc(p.id)}"`:""); }
async function hydrateImgs(root){
  if(!root) return;
  const imgs=[...root.querySelectorAll("img[data-pid]")].filter(i=>!i.getAttribute("src"));
  const need=[...new Set(imgs.map(i=>i.dataset.pid).filter(id=>!URLC[id]))];
  if(need.length&&SB){
    try{ const {data,error}=await SB.storage.from("photos").createSignedUrls(need,43200);
      if(!error&&data) data.forEach(r=>{ if(r.signedUrl&&r.path) URLC[r.path]=r.signedUrl; }); }catch(e){}
  }
  imgs.forEach(i=>{ const u=URLC[i.dataset.pid]; if(u&&i.isConnected) i.src=u; });
}
function stripLocal(j){ // never write in-memory-only photos into the database
  const c=clone(j);
  const f=a=>a.filter(p=>p.id).map(p=>({id:p.id,w:p.w,h:p.h,name:p.name||"",size:p.size||0}));
  c.cond.photos=f(c.cond.photos); c.wip.progress=f(c.wip.progress); c.wip.paint=f(c.wip.paint);
  return c;
}
function scheduleSave(id, delay=700){
  const j=JOBS[id]; if(!j) return;
  j.updatedAt=Date.now();
  clearTimeout(saveTimers[id]);
  saveTimers[id]=setTimeout(()=>flushSave(id),delay);
  setSync("Unsaved changes…");
}
async function flushSave(id){
  delete saveTimers[id];
  if(!DB||!canWrite){ setSync(DB?"Read-only access":"Not saving — storage unavailable in this view"); return; }
  if(savingNow[id]){ saveTimers[id]=setTimeout(()=>flushSave(id),400); return; }
  savingNow[id]=true;
  try{ await DB.doc("jobs/"+id).set(stripLocal(JOBS[id])); setSync("All changes saved"); }
  catch(e){
    if(e&&e.code==="invalid_argument"){ canWrite=false; showBanner("You have view-only access to these reports, so changes are not saved.","err"); }
    else if(e&&e.code==="quota_exceeded"){ showBanner("Storage is full: "+esc(e.message||""),"err"); }
    else { setSync("Save failed — will retry"); saveTimers[id]=setTimeout(()=>flushSave(id),3000); }
  }
  finally{ savingNow[id]=false; }
}
function setSync(t){ $("#syncNote").textContent=t; }
function showBanner(html,kind){ $("#banner").innerHTML=html?`<div class="banner ${kind||""}">${html}</div>`:""; }

function cfgOk(){ const c=window.EWR_CONFIG||{}, u=c.SUPABASE_URL||"", k=c.SUPABASE_ANON_KEY||"";
  return /^https?:\/\/[^\s]+$/.test(u)&&!/YOUR-PROJECT-REF/i.test(u)&&k.length>30&&!/PASTE-/i.test(k); }
function mapErr(e){ const m=(e&&(e.message||e.error_description))||String(e);
  return {code:/row-level security|violates|permission denied|not authorized/i.test(m)?"invalid_argument":"unavailable",message:m}; }
function makeShims(){
  DB={
    doc(path){ const id=path.split("/")[1]; return {
      async set(data){ const {error}=await SB.from("jobs").upsert({id,data}); if(error) throw mapErr(error); },
      async delete(){ const {error}=await SB.from("jobs").delete().eq("id",id); if(error) throw mapErr(error); } }; },
    collection(){ return { onSnapshot(next,onErr){
      const asDoc=(id,data)=>({id,exists:true,data:()=>data});
      const deliver=ch=>next({metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>ch});
      const ch=SB.channel("jobs-live").on("postgres_changes",{event:"*",schema:"public",table:"jobs"},pl=>{
        if(pl.eventType==="DELETE"){ if(pl.old&&pl.old.id) deliver([{type:"removed",doc:asDoc(pl.old.id,{})}]); }
        else if(pl.new&&pl.new.id) deliver([{type:pl.eventType==="INSERT"?"added":"modified",doc:asDoc(pl.new.id,pl.new.data)}]);
      }).subscribe(st=>{ if(st==="CHANNEL_ERROR"||st==="TIMED_OUT") setSync("Live sync interrupted — changes still save; reload to refresh"); });
      (async()=>{ const {data,error}=await SB.from("jobs").select("id,data");
        if(error){ onErr&&onErr(mapErr(error)); return; }
        deliver((data||[]).map(r=>({type:"added",doc:asDoc(r.id,r.data)}))); })();
      return ()=>SB.removeChannel(ch); } }; }
  };
  ASSETS={
    async upload(blob){ const path=(crypto.randomUUID?crypto.randomUUID():uid()+uid())+".jpg";
      const {error}=await SB.storage.from("photos").upload(path,blob,{contentType:"image/jpeg",upsert:false});
      if(error) throw mapErr(error); URLC[path]=URL.createObjectURL(blob); return {id:path}; },
    async delete(id){ const {error}=await SB.storage.from("photos").remove([id]); if(error) throw mapErr(error); },
    async deleteMany(ids){ for(let i=0;i<ids.length;i+=100){ const {error}=await SB.storage.from("photos").remove(ids.slice(i,i+100)); if(error) throw mapErr(error); } }
  };
  DL={ async save({filename,data}){
    const blob=data instanceof Blob?data:new Blob([data]); const u=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=u; a.download=filename; a.rel="noopener"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),120000); return {status:"saved"}; } };
}

const PW_MIN=10;
function pwProblem(p){
  if(p.length<PW_MIN) return `Use at least ${PW_MIN} characters.`;
  if(!/[A-Za-z]/.test(p)||!/\d/.test(p)) return "Use both letters and numbers.";
  if(/^(.)\1+$/.test(p)) return "Too simple.";
  return "";
}
async function changePassword(){
  if(!SB) return;
  const ok=await dialog("Change password",`<label class="f">New password<input id="pw1" type="password" autocomplete="new-password"></label>
    <label class="f" style="margin-top:8px">Repeat new password<input id="pw2" type="password" autocomplete="new-password"></label>
    <div class="muted" style="font-size:12px;margin-top:8px">At least ${PW_MIN} characters, with letters and numbers. Don't reuse a password from another site.</div>`,"Save password");
  if(!ok) return;
  const a=$("#pw1")?.value||"", b=$("#pw2")?.value||"";
  if(a!==b){ await dialog("Not changed","The two passwords don't match.","OK",false); return; }

  const {error}=await SB.auth.updateUser({password:a});
  if(error){ await dialog("Not changed",esc(error.message||"Couldn't change the password."),"OK",false); return; }
  toast("Password changed");
}
let started=false;
function startApp(session){
  if(started) return; started=true;
  $("#login").hidden=true; $("#who").textContent=session&&session.user?session.user.email:"";
  let loaded=false;
  const timer=setTimeout(()=>{ if(!loaded) setSync("Can't reach the database yet…"); },10000);
  DB.collection("jobs").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){ loaded=true; clearTimeout(timer); }
    let changedCur=false;
    snap.docChanges().forEach(ch=>{
      const id=ch.doc.id;
      if(ch.type==="removed"){ delete JOBS[id]; if(id===curId){ curId=null; changedCur=true; } return; }
      if(saveTimers[id]||savingNow[id]) return;              // local edits win while pending
      const incoming=normalize(clone(ch.doc.data()));
      const local=JOBS[id];
      if(local){
        ["cond.photos","wip.progress","wip.paint"].forEach(p=>{ const loc=getPath(local,p).filter(x=>!x.id); if(loc.length) setPath(incoming,p,getPath(incoming,p).concat(loc)); });
        if(JSON.stringify(stripLocal(local))===JSON.stringify(stripLocal(incoming))) return;
      }
      JOBS[id]=incoming; if(id===curId) changedCur=true;
    });
    setSync(loaded?"All changes saved":"Loading…");
    renderList();
    if(changedCur){ const a=document.activeElement; if(!(a&&a.closest&&a.closest(".editor"))) renderMain(); else renderPreview(); }
    else if(!curId) renderMain();
  },err=>{ clearTimeout(timer); setSync("Database unavailable"); showBanner("Couldn't load jobs: "+esc(err.message||err.code),"err"); });
  renderAll();
}

/* ============================================================
   Photos: downscale -> upload
   ============================================================ */
function loadImage(file){ return new Promise((res,rej)=>{ const u=URL.createObjectURL(file); const im=new Image(); im.onload=()=>{res(im);}; im.onerror=()=>rej(new Error("Not an image")); im.src=u; }); }
async function prepPhoto(file){
  const im=await loadImage(file);
  const MAX=1800; let w=im.naturalWidth, h=im.naturalHeight; const s=Math.min(1,MAX/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
  const c=document.createElement("canvas"); c.width=w; c.height=h; const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,w,h); g.drawImage(im,0,0,w,h);
  URL.revokeObjectURL(im.src);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  return {blob,w,h};
}
async function addPhotos(path, files){
  const id=curId; const j=JOBS[id]; if(!j) return;
  files=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|heic)$/i.test(f.name));
  if(!files.length){ toast("No image files found"); return; }
  const list=getPath(j,path);
  for(const f of files){
    const ph={w:0,h:0,name:f.name,busy:true,tmp:uid()}; list.push(ph); renderPhotos(path);
    try{
      const {blob,w,h}=await prepPhoto(f); ph.w=w; ph.h=h; ph.size=blob.size;
      if(ASSETS&&canWrite){ const r=await ASSETS.upload(blob); ph.id=r.id; }
      else { ph.src=await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob);}); }
      delete ph.busy; delete ph.tmp;
    }catch(e){ list.splice(list.indexOf(ph),1); toast("Couldn't add "+f.name+(e&&e.code?" ("+e.code+")":"")); }
    if(curId===id) renderPhotos(path);
    scheduleSave(id,300);
  }
  renderList(); renderTabs(); renderPreview();
}

/* ---------- Preview (paginated approximation of the A3 layout) ---------- */
let prevTimer=null;
function renderPreview(){ clearTimeout(prevTimer); prevTimer=setTimeout(_renderPreview,120); }
function _renderPreview(){
  const j=JOBS[curId]; const el=$("#preview"); if(!j||!el) return;
  if(j.archived){ el.innerHTML=`<div class="empty" style="height:auto;padding:60px 20px"><div style="font-size:40px">📦</div><div><b>Archived</b> — the reports are saved in ${esc(j.archived.where||"your PC")}.</div></div>`; return; }
  const kind=tab; const B=model(j,kind);
  // paginate by rough height units (page = 100)
  const pages=[[]]; let used=0; const push=(html,hh)=>{ if(used+hh>100&&pages[pages.length-1].length){ pages.push([]); used=0; } pages[pages.length-1].push(html); used+=hh; };
  for(const b of B){
    if(b.type==="header"){ push(`<div class="hdr"><div><img src="${LOGO}" alt=""></div><div class="t">${b.title.map(esc).join("<br>")}</div><div class="d">${b.fields.map(([k,v])=>`<b>${esc(k)}</b> ${esc(v)}`).join("<br>")}</div></div>`,20); }
    else if(b.type==="title") push(`<div class="ptitle ${b.bold?"b":""}">${esc(b.text)}</div>`,6);
    else if(b.type==="photos"){
      if(!b.list.length) push(`<div class="ph-empty">No photos yet</div>`,14);
      b.list.forEach(p=>{ const ar=p.w&&p.h?p.h/p.w:0.75; const hh=Math.min(41,88*ar*0.62)+2.5; push(`<img class="pimg" ${imgAttrs(p)} alt="" style="width:${(Math.min(88,41/(ar*0.62)*1)).toFixed(1)}%">`,hh); });
    }
    else if(b.type==="h") push(`<div class="phead" ${b.big?'style="font-size:clamp(8px,1.3vw,12.5px)"':""}>${esc(b.text)}</div>`,3.2);
    else if(b.type==="p") push(`<div class="pp"><b>${esc(b.text)}</b></div>`,2.4);
    else if(b.type==="ul"){ b.items.forEach(it=>{ const t=typeof it==="string"?it:it.t, sub=typeof it==="string"?[]:it.sub;
        push(`<ul class="pul"><li>${esc(t)}${sub.length?`<ul>${sub.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}</li></ul>`,2.4*Math.ceil(t.length/95)+2.2*sub.length+0.6); }); }
    else if(b.type==="hr") push(`<hr class="phr">`,2);
    else if(b.type==="layout"){ const ar=b.h/b.w; const wPct=Math.min(92, 70/(ar*0.62)); push(`<img class="pimg" src="${esc(b.src)}" alt="" style="width:${wPct.toFixed(1)}%;max-height:none">`, Math.min(72,92*ar*0.62)+3); }
    else if(b.type==="signtable") push(`<table class="psig"><tr><th>Role</th><th>Name</th><th>Signature</th><th>Date</th></tr>${b.rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td class="c">${esc(r[2])}</td><td class="c">${esc(r[3])}</td></tr>`).join("")}</table>`,13);
    else if(b.type==="sign") push(`<div class="psign" ${b.small?'style="margin-top:1%"':""}>${esc(b.label)} <span style="font-weight:700">${esc(b.name||"")}</span></div>`,4);
    else if(b.type==="break"){ if(pages[pages.length-1].length){ pages.push([]); used=0; } }
  }
  const label=kind==="cond"?"Condition Report":kind==="wip"?"WIP Report":"Completion Report";
  el.innerHTML=`<div class="muted" style="text-align:center;font-size:12px;margin-bottom:8px">${label} preview · A3 · ${pages.length} page(s) (approximate)</div>`+
    pages.map((p,i)=>`<div class="paper">${p.join("")}<div class="pg">${i+1}</div></div>`).join("");
  hydrateImgs(el);
}

   ============================================================ */
async function photoBytes(p){
  if(p.src&&p.src.startsWith("data:")){ const b=atob(p.src.split(",")[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  if(p.id&&SB){ const {data,error}=await SB.storage.from("photos").download(p.id); if(error) throw new Error("Couldn't download a photo: "+error.message); return new Uint8Array(await data.arrayBuffer()); }
  const r=await fetch(photoSrc(p)); if(!r.ok) throw new Error("photo "+r.status); return new Uint8Array(await r.arrayBuffer());
}
function logoBytes(){ const b=atob(LOGO.split(",")[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function doExport(kind,fmt,btn){
  const j=JOBS[curId]; if(!j||!DL) return;
  const old=btn.innerHTML; btn.disabled=true; btn.textContent="Building…";
  try{
    const B=model(j,kind);
    const data=fmt==="docx"?await buildDocx(B):await buildPdf(B);
    await DL.save({filename:fileBase(j,kind)+"."+fmt,data});
    toast("Saved "+fmt.toUpperCase());
  }catch(e){
    if(e&&e.code==="declined") toast("Download cancelled");
    else if(e&&e.code==="rate_limited") toast("A download prompt is already open");
    else { console.error(e); dialog("Export failed",esc((e&&(e.message||e.code))||String(e)),"Close",false); }
  }finally{ btn.disabled=false; btn.innerHTML=old; }
}

/* ============================================================
   Archive: reports + photos -> PC folder (or ZIP), then free cloud space
   ============================================================ */
let archiveDir=null, archiveDirName="";
function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open("ewr",1); r.onupgradeneeded=()=>r.result.createObjectStore("kv"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
async function kvGet(k){ try{ const d=await idb(); return await new Promise(r=>{ const q=d.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>r(q.result); q.onerror=()=>r(null); }); }catch(e){ return null; } }
async function kvSet(k,v){ try{ const d=await idb(); await new Promise(r=>{ const t=d.transaction("kv","readwrite"); t.objectStore("kv").put(v,k); t.oncomplete=r; t.onerror=r; }); }catch(e){} }
(async()=>{ const h=await kvGet("archiveDir"); if(h){ archiveDir=h; archiveDirName=h.name; } })();
async function pickArchiveDir(force){   // must run first in a click handler (browser rule)
  if(!window.showDirectoryPicker) return null;
  if(archiveDir&&!force){
    let st="prompt"; try{ st=await archiveDir.queryPermission({mode:"readwrite"}); }catch(e){}
    if(st!=="granted"){ try{ st=await archiveDir.requestPermission({mode:"readwrite"}); }catch(e){ st="denied"; } }
    if(st==="granted") return archiveDir;
  }
  try{ archiveDir=await window.showDirectoryPicker({id:"ewr-archive",mode:"readwrite",startIn:"desktop"}); }

async function writeFile(dir,path,data){
  const parts=path.split("/"); let d=dir;
  for(const seg of parts.slice(0,-1)) d=await d.getDirectoryHandle(seg,{create:true});
  const fh=await d.getFileHandle(parts[parts.length-1],{create:true}); const w=await fh.createWritable();
  await w.write(data instanceof Uint8Array?new Blob([data]):data); await w.close();
}
async function buildArchiveFiles(j,progress){
  const files=[]; const kinds=[["cond","Condition"],["wip","WIP"],["comp","Completion"]];
  for(const [k] of kinds){ progress("Building "+k+" report…"); const B=model(j,k); const base=fileBase(j,k);
    files.push([base+".docx",await buildDocx(B)]); files.push([base+".pdf",await buildPdf(B)]); }
  const groups=[["cond.photos","Photos/1 Condition (before repair)","Condition"],["wip.progress","Photos/2 Work in progress","WIP"],["wip.paint","Photos/3 Paint & Package","Paint"]];
  let n=0;
  for(const [path,folder,pre] of groups){ const list=getPath(j,path);
    for(let i=0;i<list.length;i++){ progress(`Saving photos ${++n}…`); files.push([`${folder}/${pre} ${String(i+1).padStart(2,"0")}.jpg`,await photoBytes(list[i])]); } }
  files.push(["job-data.json",JSON.stringify(stripLocal(j),null,1)]);

}
async function archiveJob(btn){
  const id=curId, j=JOBS[id]; if(!j||!completionState(j).ready) return;
  const jobFolder=safeName(j.header.jobNo||"Job "+id);
  // 1) where to save — asked first, while the click still counts
  let dir=null;
  if(window.showDirectoryPicker){
    if(!archiveDir) await dialog("Choose the archive folder",`<p>Pick the folder that holds your job folders, e.g. <b>Desktop › completion report › engineering</b>.
      The app creates <b>${esc(jobFolder)}</b> inside it. You only choose this once.</p>`,"Choose folder",false);
    try{ dir=await pickArchiveDir(false); }catch(e){ dir=null; }
    if(dir==="cancel") return;
  }
  const old=btn.innerHTML; btn.disabled=true; const prog=t=>{ btn.textContent=t; };
  try{
    // 2) build everything
    const {files,photos}=await buildArchiveFiles(j,prog);
    // 3) save
    let where="";
    if(dir){ prog("Writing to "+dir.name+"…"); const sub=await dir.getDirectoryHandle(jobFolder,{create:true});
      for(const [path,data] of files) await writeFile(sub,path,data);
      where=dir.name+"\\"+jobFolder; }
    else { prog("Zipping…"); const zip=new JSZip(); files.forEach(([path,data])=>zip.file(jobFolder+"/"+path,data));
      const blob=await zip.generateAsync({type:"blob",compression:"STORE"}); await DL.save({filename:jobFolder+" archive.zip",data:blob});
      const got=await dialog("Is the ZIP saved?",`<p>The download <b>${esc(jobFolder)} archive.zip</b> (${(blob.size/1048576).toFixed(1)} MB) should be in your Downloads.
        Open or move it to a safe place before continuing.</p>`,"Yes, it's saved");
      if(!got){ toast("Archive stopped — nothing was deleted"); return; }
      where="ZIP: "+jobFolder+" archive.zip"; }
    // 4) free cloud space — only with a clear yes
    const ids=[...j.cond.photos,...j.wip.progress,...j.wip.paint].map(p=>p.id).filter(Boolean);
    const ok=await dialog("Free cloud space?",`<p>Saved ${files.length} files to <b>${esc(where)}</b>.</p>
      <p>Delete this job's <b>${ids.length} photos</b> from the cloud now? They stay in the archive on your PC; the cloud copy can't be recovered.</p>`,"Delete cloud photos");
    if(!ok){ toast("Archive saved — cloud photos kept"); return; }
    prog("Freeing cloud space…");
    if(ASSETS){ if(ASSETS.deleteMany) await ASSETS.deleteMany(ids); else for(const x of ids) await ASSETS.delete(x); }
    j.archived={at:todayStr(),where,photos,files:files.map(f=>f[0])};
    j.cond.photos=[]; j.wip.progress=[]; j.wip.paint=[];
    scheduleSave(id,50); renderAll(); toast("Job archived — "+ids.length+" photos removed from the cloud");
  }catch(e){ console.error(e); dialog("Archive failed",`<p>${esc(e.message||String(e))}</p><p>Nothing was deleted from the cloud.</p>`,"Close",false); }
  finally{ if(btn.isConnected){ btn.disabled=false; btn.innerHTML=old; } }
}

async function buildPdf(B){
  if(!window.jspdf) throw new Error("PDF export library didn't load. Check your connection and reload.");
  const {jsPDF}=window.jspdf; const pdf=new jsPDF({unit:"mm",format:"a3",orientation:"portrait",compress:true});
  const PW=297, PH=420, M=25.4, CW=PW-2*M, BOT=PH-M; let y=M;
  const need=h=>{ if(y+h>BOT){ pdf.addPage(); y=M; } };
  const pt2mm=pt=>pt*0.3528;
  for(const b of B){
    if(b.type==="header"){
      const total=227.5, cols=[67.45,56.63,103.42], x0=(PW-total)/2;
      pdf.setFont("helvetica","normal"); const fs=16; const lh=pt2mm(fs)*1.22;
      const detH=b.fields.length*lh+6; const H=Math.max(detH,40);
      pdf.setLineWidth(0.3); pdf.rect(x0,y,total,H); pdf.line(x0+cols[0],y,x0+cols[0],y+H); pdf.line(x0+cols[0]+cols[1],y,x0+cols[0]+cols[1],y+H);
      const lw=cols[0]-6, lhgt=lw*LOGO_H/LOGO_W; pdf.addImage(LOGO,"PNG",x0+3,y+(H-lhgt)/2,lw,lhgt);
      pdf.setFont("helvetica","bold"); pdf.setFontSize(18); const tl=[]; b.title.forEach(t=>tl.push(...pdf.splitTextToSize(t,cols[1]-4)));
      const tlh=pt2mm(18)*1.2; let ty=y+H/2-(tl.length*tlh)/2+tlh*0.8; tl.forEach(t=>{ pdf.text(t,x0+cols[0]+cols[1]/2,ty,{align:"center"}); ty+=tlh; });
      let dy=y+(H-b.fields.length*lh)/2+lh*0.78; const dx=x0+cols[0]+cols[1]+2.5;
      pdf.setFontSize(fs);
      b.fields.forEach(([k,v])=>{ pdf.setFont("helvetica","bold"); pdf.text(k,dx,dy); const kw=pdf.getTextWidth(k+" "); pdf.setFont("helvetica","normal"); const vv=pdf.splitTextToSize(String(v||""),cols[2]-5-kw)[0]||""; pdf.text(vv,dx+kw,dy); dy+=lh; });
      y+=H+6;
    } else if(b.type==="title"){
      need(pt2mm(28)*3); pdf.setFont("helvetica",b.bold?"bold":"normal"); pdf.setFontSize(26); y+=8; pdf.text(b.text,PW/2,y,{align:"center"}); y+=8;
    } else if(b.type==="photos"){
      if(!b.list.length){ need(10); pdf.setFont("helvetica","italic"); pdf.setFontSize(12); pdf.text("(no photos)",PW/2,y+5,{align:"center"}); y+=10; }
      for(const p of b.list){
        const bytes=await photoBytes(p); const [cx,cy]=fitPhoto(p.w,p.h); const w=cx/36000, h=cy/36000;

    } else if(b.type==="p"){
      need(8); pdf.setFont("helvetica","bold"); pdf.setFontSize(14); pdf.text(b.text,M,y+5); y+=7.5;
    } else if(b.type==="ul"){

      const bullet=(t,lvl)=>{ pdf.setFont("helvetica","normal"); const ind=M+(lvl?25.4:12.7); const lines=pdf.splitTextToSize(t,PW-M-ind); need(lines.length*lh+1.5);
        pdf.text(lvl?"o":"•",ind-6,y+5); lines.forEach((l,i)=>pdf.text(l,ind,y+5+i*lh)); y+=lines.length*lh+1.5; };

    } else if(b.type==="signtable"){
      const W=[2500,3600,2600,1800].map(v=>v/1440*25.4), TW=W.reduce((a,b)=>a+b), x0=(PW-TW)/2, hh=8.8, rh=13.4;
      need(hh+rh*b.rows.length+10); y+=8;
      pdf.setFillColor(0,0,0); pdf.rect(x0,y,TW,hh,"F"); pdf.setTextColor(255,255,255); pdf.setFont("helvetica","bold"); pdf.setFontSize(11);
      let x=x0; ["Role","Name","Signature","Date"].forEach((t,i)=>{ pdf.text(t,i>=2?x+W[i]/2:x+2,y+hh/2+1.4,i>=2?{align:"center"}:undefined); x+=W[i]; });
      pdf.setTextColor(0,0,0); y+=hh; pdf.setDrawColor(154,160,166); pdf.setLineWidth(0.25);
      b.rows.forEach(r=>{ x=x0; r.forEach((t,i)=>{ pdf.rect(x,y,W[i],rh); pdf.setFont("helvetica",i===0?"bold":"normal"); pdf.setFontSize(10.5);
          const lines=pdf.splitTextToSize(String(t||""),W[i]-4); const ty=y+rh/2-(lines.length-1)*2.1+1.3;
          lines.forEach((l,k)=>pdf.text(l,i>=2?x+W[i]/2:x+2,ty+k*4.2,i>=2?{align:"center"}:undefined)); x+=W[i]; }); y+=rh; });
      pdf.setDrawColor(0); y+=4;
    } else if(b.type==="hr"){
      need(6); y+=2.5; pdf.setDrawColor(150); pdf.setLineWidth(0.3); pdf.line(M,y,PW-M,y); pdf.setDrawColor(0); y+=3;
    } else if(b.type==="sign"){
      const fs=b.small?16:20; need(16); y+=b.small?2:12; pdf.setFont("helvetica","bold"); pdf.setFontSize(fs);
      const txt=b.label+" "+(b.name||""); pdf.text(txt,PW/2,y+5,{align:"center"}); y+=pt2mm(fs)*1.6;
    } else if(b.type==="break"){ if(y>M+1){ pdf.addPage(); y=M; } }
  }
  return pdf.output("blob");
}

   Boot
   ============================================================ */
renderAll();
wireExtras();
initPlatform();
</script>
